<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Modern weather forecast app with beautiful design" />
    <title>Weather Forecast App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="app-header">
      <h1 class="app-title">Weather Forecast</h1>
      <p class="app-subtitle">Get accurate weather information for any location</p>
    </div>
    
    <form id="form">
      <input
        type="text"
        id="search"
        name="search"
        placeholder="Enter city name or location..."
        required
        autocomplete="off"
      />
      <button id="submit" type="submit">Search</button>
    </form>
    
    <div id="content">
      <div class="welcome-message">
        <h2 style="color: white; text-align: center; font-size: 1.8rem; margin-bottom: 20px;">Welcome! 🌤️</h2>
        <p style="color: rgba(255, 255, 255, 0.9); text-align: center; font-size: 1.1rem; line-height: 1.6; max-width: 600px; margin: 0 auto;">
          Enter any city name above to get detailed weather information including current conditions, temperature, wind speed, and a multi-day forecast.
        </p>
        <p style="color: rgba(255, 255, 255, 0.85); text-align: center; font-size: 1rem; margin-top: 30px;">
          Try searching for: <strong>London</strong>, <strong>New York</strong>, <strong>Tokyo</strong>, or <strong>Paris</strong>
        </p>
      </div>
    </div>
  </body>
</html>
